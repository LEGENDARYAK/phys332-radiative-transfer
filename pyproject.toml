[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phys332-rtmc"
version = "0.1.0"
description = "Modular Monte Carlo radiative transfer for a PHYS 332 group project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "PHYS 332 project team"}]
dependencies = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
rtmc = "rtmc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
